[workspace]
members = ["crates/graphylite", "crates/glite", "crates/pygraphylite"]
resolver = "2"

[workspace.dependencies]
redb = "2.6"
bincode = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
decypher = "0.2.0-alpha.6"
clap = { version = "4.5", features = ["derive"] }
rustyline = "14.0"
comfy-table = "7.1"
